[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallstreet-mcp-tools"
version = "0.1.0"
description = "Lightweight Python SDK for Wall Street Hedge Fund Suite (90+ Engines) via Model Context Protocol (MCP)"
readme = "README.md"
authors = [{ name = "MCP Collector", email = "mcp_collector@apify.actor" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mcp-collector-pick/wallstreet-mcp-examples"
Repository = "https://github.com/mcp-collector-pick/wallstreet-mcp-examples.git"
"Apify Actor" = "https://apify.com/mcp_collector/wallstreet-hedgefund-suite-mcp"
